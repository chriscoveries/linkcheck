[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck"
version = "0.2.0"
description = "Pre-publish link hygiene for social drafts: redirect hops, tracker domains, and shared tracking codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "linkcheck contributors" }]
keywords = ["links", "redirects", "tracking", "privacy", "drafts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pydantic>=2",
  "requests>=2.28",
]

[project.optional-dependencies]
whois = ["python-whois>=0.9"]
dev = ["pytest>=7.0"]

[project.scripts]
linkcheck = "linkcheck.cli:main"

[project.urls]
Homepage = "https://github.com/chriscoveries/linkcheck"
Documentation = "https://github.com/chriscoveries/linkcheck#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkcheck = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
