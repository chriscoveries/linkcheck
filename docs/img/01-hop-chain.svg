<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Anonymised redirect hop chain</title>
  <desc id="desc">Creator short link passes through track.example with a shared campaign code, then lands on the article.</desc>
  <rect width="960" height="280" fill="#f7f5f0"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="18" fill="#1c1917">Hop chain (placeholders only)</text>
  <text x="24" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">No real accounts, agencies, or domains.</text>

  <rect x="24" y="90" width="200" height="120" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="40" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">1. Post</text>
  <text x="40" y="148" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#44403c">Creator A</text>
  <text x="40" y="172" font-family="ui-monospace, monospace" font-size="12" fill="#1d4ed8">short.example/abc</text>
  <text x="40" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Reader sees only this.</text>

  <path d="M234 150 H290" stroke="#78716c" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="300" y="90" width="320" height="120" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="316" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c2410c">2. Shared tracker hop</text>
  <text x="316" y="148" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">track.example/c/</text>
  <text x="316" y="168" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">?utm_source=XX&amp;utm_campaign=a1b2c3d4</text>
  <text x="316" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#9a3412">Creator + campaign IDs live here.</text>

  <path d="M630 150 H686" stroke="#78716c" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="696" y="90" width="240" height="120" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="712" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">3. Destination</text>
  <text x="712" y="148" font-family="ui-monospace, monospace" font-size="11" fill="#166534">news.example/story</text>
  <text x="712" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#166534">+ leftover utm_* tags</text>
  <text x="712" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78716c">Article loads; hop already logged.</text>
</svg>
