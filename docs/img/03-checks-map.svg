<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">linkcheck checks mapped to leaks</title>
  <desc id="desc">Each leak type maps to a concrete linkcheck finding code.</desc>
  <rect width="960" height="320" fill="#f7f5f0"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="18" fill="#1c1917">Leak → linkcheck finding</text>
  <text x="24" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#57534e">One check per leak. Severities shown as WARN or BLOCK.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <text x="40" y="100" fill="#57534e">Leak</text>
    <text x="420" y="100" fill="#57534e">Finding code</text>
    <text x="720" y="100" fill="#57534e">Severity</text>
    <line x1="24" y1="112" x2="936" y2="112" stroke="#d6d3d1"/>

    <text x="40" y="140" fill="#1c1917">Shared tracker / redirect hop</text>
    <text x="420" y="140" font-family="ui-monospace, monospace" fill="#9a3412">intermediate_hop / blocklisted_hop</text>
    <text x="720" y="140" fill="#c2410c">WARN / BLOCK</text>

    <text x="40" y="172" fill="#1c1917">IDs or tokens in params</text>
    <text x="420" y="172" font-family="ui-monospace, monospace" fill="#9a3412">campaign_code / tracking_param</text>
    <text x="720" y="172" fill="#c2410c">WARN</text>

    <text x="40" y="204" fill="#1c1917">New-domain age</text>
    <text x="420" y="204" font-family="ui-monospace, monospace" fill="#9a3412">young_domain</text>
    <text x="720" y="204" fill="#c2410c">WARN</text>

    <text x="40" y="236" fill="#1c1917">Shared codes across accounts</text>
    <text x="420" y="236" font-family="ui-monospace, monospace" fill="#9a3412">shared_tracking_code</text>
    <text x="720" y="236" fill="#c2410c">WARN</text>

    <text x="40" y="268" fill="#1c1917">Scripted wording across accounts</text>
    <text x="420" y="268" font-family="ui-monospace, monospace" fill="#9a3412">script_near_duplicate / script_phrase</text>
    <text x="720" y="268" fill="#c2410c">WARN</text>

    <text x="40" y="300" fill="#1c1917">Posting-time clustering</text>
    <text x="420" y="300" font-family="ui-monospace, monospace" fill="#9a3412">posting_time_cluster</text>
    <text x="720" y="300" fill="#c2410c">WARN</text>
  </g>
</svg>
