<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized hop chain</title>
  <desc id="desc">A short link forwards through a hidden tracker hop that carries a shared code, then lands on the article with extra tags.</desc>
  <rect width="980" height="420" fill="#f6f4ef"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1917">How a shared link actually travels</text>
  <text x="24" y="52" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">Placeholder diagram. No real accounts, outlets, or tracker hosts.</text>

  <rect x="20" y="74" width="280" height="300" rx="10" fill="#fff" stroke="#1d4ed8"/>
  <text x="36" y="100" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">1. The post</text>
  <text x="36" y="128" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">Account A</text>
  <text x="36" y="160" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1917">A useful note on local workshops.</text>
  <text x="36" y="180" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#1c1917">Check it out:</text>
  <rect x="36" y="196" width="200" height="26" rx="4" fill="#eff6ff"/>
  <text x="44" y="214" font-family="ui-monospace, monospace" font-size="12" fill="#1d4ed8">short.example/ab12</text>
  <text x="36" y="250" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#78716c">Reader sees only the short link.</text>

  <rect x="340" y="74" width="300" height="300" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="356" y="100" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="700" fill="#c2410c">2. Hidden redirect</text>
  <text x="356" y="128" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">short.example forwards to:</text>
  <text x="356" y="160" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">track.example/c/</text>
  <text x="356" y="178" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">?utm_source=XX</text>
  <text x="356" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">&amp;utm_campaign=a1b2c3d4</text>
  <text x="356" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#9a3412">&amp;ref=https://news.example/story</text>
  <text x="356" y="248" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">a1b2c3d4 is a shared code.</text>
  <text x="356" y="266" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">The same value on other</text>
  <text x="356" y="284" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">accounts ties the posts together.</text>
  <text x="356" y="320" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#9a3412">Then a 302 to the article.</text>

  <rect x="680" y="74" width="280" height="300" rx="10" fill="#f0fdf4" stroke="#15803d"/>
  <text x="696" y="100" font-family="ui-sans-serif, sans-serif" font-size="13" font-weight="700" fill="#15803d">3. Destination</text>
  <text x="696" y="128" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">The article, plus tags:</text>
  <text x="696" y="160" font-family="ui-monospace, monospace" font-size="11" fill="#166534">news.example/story</text>
  <text x="696" y="178" font-family="ui-monospace, monospace" font-size="11" fill="#166534">?utm_source=partner_net</text>
  <text x="696" y="196" font-family="ui-monospace, monospace" font-size="11" fill="#166534">&amp;utm_medium=cpc</text>
  <text x="696" y="214" font-family="ui-monospace, monospace" font-size="11" fill="#166534">&amp;utm_campaign=spring_story</text>
  <text x="696" y="248" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">The reader lands on the story.</text>
  <text x="696" y="266" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">The hop and the code already</text>
  <text x="696" y="284" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#44403c">left a trail.</text>

  <path d="M300 210 H332" stroke="#78716c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640 210 H672" stroke="#78716c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#78716c"/>
    </marker>
  </defs>
</svg>
