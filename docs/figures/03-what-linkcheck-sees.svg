<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">What linkcheck reports</title>
  <desc id="desc">Each part of the anonymized chain maps to a verdict: intermediate hop and opaque code warn, blocklisted hop blocks, tracking is stripped from the suggested link.</desc>
  <rect width="980" height="280" fill="#f6f4ef"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1917">What linkcheck does with that chain</text>

  <g font-family="ui-sans-serif, sans-serif" font-size="13">
    <rect x="20" y="56" width="940" height="44" rx="8" fill="#fff" stroke="#d6d3d1"/>
    <text x="36" y="83" fill="#1c1917">short.example/ab12</text>
    <text x="760" y="83" fill="#57534e">known shortener — recorded, not warned</text>

    <rect x="20" y="112" width="940" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="36" y="139" fill="#9a3412">track.example/c/?utm_campaign=a1b2c3d4</text>
    <text x="620" y="139" fill="#c2410c">WARN hidden hop + shared code</text>

    <rect x="20" y="168" width="940" height="44" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="36" y="195" fill="#991b1b">any hop on your blocklist</text>
    <text x="760" y="195" fill="#b91c1c">BLOCK</text>

    <rect x="20" y="224" width="940" height="40" rx="8" fill="#f0fdf4" stroke="#15803d"/>
    <text x="36" y="249" fill="#166534">Suggested clean link: https://news.example/story</text>
  </g>
</svg>
