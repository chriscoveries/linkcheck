<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized shared wording</title>
  <desc id="desc">Three different accounts post the same sentence and different short links to the same page.</desc>
  <rect width="980" height="340" fill="#f6f4ef"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1917">Same sentence, different accounts, different short links</text>
  <text x="24" y="52" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#57534e">The highlighted line is identical. Each short link can still resolve through the same tracker code.</text>

  <g font-family="ui-sans-serif, sans-serif">
    <rect x="20" y="74" width="300" height="240" rx="10" fill="#111827"/>
    <text x="36" y="104" fill="#e7e5e4" font-size="13">Account A</text>
    <text x="36" y="140" fill="#fde68a" font-size="13">The same sentence is</text>
    <text x="36" y="158" fill="#fde68a" font-size="13">posted by each account</text>
    <text x="36" y="176" fill="#fde68a" font-size="13">in this example.</text>
    <text x="36" y="210" fill="#93c5fd" font-size="12">short.example/ab12</text>
    <text x="36" y="250" fill="#a8a29e" font-size="11">notes.example/page</text>

    <rect x="340" y="74" width="300" height="240" rx="10" fill="#111827"/>
    <text x="356" y="104" fill="#e7e5e4" font-size="13">Account B</text>
    <text x="356" y="140" fill="#fde68a" font-size="13">The same sentence is</text>
    <text x="356" y="158" fill="#fde68a" font-size="13">posted by each account</text>
    <text x="356" y="176" fill="#fde68a" font-size="13">in this example.</text>
    <text x="356" y="210" fill="#93c5fd" font-size="12">short.example/cd34</text>
    <text x="356" y="250" fill="#a8a29e" font-size="11">notes.example/page</text>

    <rect x="660" y="74" width="300" height="240" rx="10" fill="#111827"/>
    <text x="676" y="104" fill="#e7e5e4" font-size="13">Account C</text>
    <text x="676" y="140" fill="#fde68a" font-size="13">The same sentence is</text>
    <text x="676" y="158" fill="#fde68a" font-size="13">posted by each account</text>
    <text x="676" y="176" fill="#fde68a" font-size="13">in this example.</text>
    <text x="676" y="210" fill="#93c5fd" font-size="12">short.example/ef56</text>
    <text x="676" y="250" fill="#a8a29e" font-size="11">notes.example/page</text>
  </g>
</svg>
